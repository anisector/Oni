name: Sync Anizium

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-anizium.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download working Anizium binary
        run: |
          curl -fL "https://raw.githubusercontent.com/aytzey/cs-kraptor/builds/Anizium.cs3" -o Anizium.cs3
          test "$(stat -c%s Anizium.cs3)" = "80371"
          echo "8ae8ce4c9e53f6c95530d0ffb8070c8469f4c1d8ea93247f2ef28d6dc7e351fb  Anizium.cs3" | sha256sum -c -

      - name: Commit Anizium binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Anizium.cs3
          if git diff --cached --quiet; then
            echo "Anizium.cs3 already up to date"
          else
            git commit -m "Sync working Anizium provider"
            git push
          fi
